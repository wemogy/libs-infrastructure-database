name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.0.0
        type: string
        required: false
      pre-release:
        description: Genereates a Pre-Release when checked
        type: boolean
        required: false
        default: false
  push:
    branches:
      - release

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: "write"
      packages: "write"
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version for next release
        uses: wemogy/get-release-version-action@v4.3.2
        id: release-version
        if: ${{ github.event.inputs.version == '' }}
        with:
          prefix: v
          create-tag: 'true'
          git-username: wemogy IT
          git-email: it@wemogy.com
          mode: semantic

      # The version action walks the history in reverse *commit date* order and stops at the
      # commit the previous tag points at, so a branch that was open while another release was cut
      # carries commits older than that tag which are never analyzed. That is how the breaking
      # changes of v5 shipped as the minor v4.4.0. This compares the same range by *ancestry* and
      # stops the release rather than letting a breaking change out under a minor number.
      - name: Verify the bump covers every breaking change
        if: ${{ github.event.inputs.version == '' && steps.release-version.outputs.tag-created == 'true' }}
        env:
          PREVIOUS_VERSION_NAME: ${{ steps.release-version.outputs.previous-version-name }}
          PREVIOUS_VERSION: ${{ steps.release-version.outputs.previous-version }}
          NEXT_VERSION: ${{ steps.release-version.outputs.version }}
          NEXT_VERSION_NAME: ${{ steps.release-version.outputs.version-name }}
        shell: bash
        run: |
          set -uo pipefail

          if [ -z "$PREVIOUS_VERSION_NAME" ]; then
            echo "No previous version to compare against, nothing to verify."
            exit 0
          fi

          range="$PREVIOUS_VERSION_NAME..HEAD"

          # "feat!:" / "fix(scope)!:" in the subject, or a "BREAKING CHANGE:" footer in the body
          breaking=$(
            {
              git log "$range" --format='%h %s' --extended-regexp \
                --grep='^[a-zA-Z]+(\([^)]*\))?!:'
              git log "$range" --format='%h %s' --extended-regexp \
                --grep='^BREAKING[ -]CHANGE:'
            } | sort -u
          )

          if [ -z "$breaking" ]; then
            echo "No breaking commits in $range."
            exit 0
          fi

          echo "Breaking commits in $range:"
          echo "$breaking"

          if [ "${NEXT_VERSION%%.*}" -gt "${PREVIOUS_VERSION%%.*}" ]; then
            echo "$PREVIOUS_VERSION -> $NEXT_VERSION is a major bump. OK."
            exit 0
          fi

          # the action already pushed the tag for the wrong version, so take it back out to leave
          # the repository re-runnable
          echo "Removing the tag $NEXT_VERSION_NAME that was created for the wrong version."
          git push --delete origin "$NEXT_VERSION_NAME" || echo "Could not delete the remote tag, remove it by hand."
          git tag --delete "$NEXT_VERSION_NAME" || true

          {
            echo "### Release stopped: breaking changes would have shipped as $NEXT_VERSION"
            echo
            echo "These commits are marked breaking, but the computed bump is"
            echo "\`$PREVIOUS_VERSION\` -> \`$NEXT_VERSION\`, which is not a new major:"
            echo
            echo '```'
            echo "$breaking"
            echo '```'
            echo
            echo "The tag \`$NEXT_VERSION_NAME\` has been removed again. Re-run this workflow with an"
            echo "explicit \`version\` input set to the intended major."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::Breaking commits in $range, but $PREVIOUS_VERSION -> $NEXT_VERSION is not a major bump. Re-run with an explicit version input."
          exit 1

      # Nuget
      - name: Build .NET
        uses: ./.github/actions/dotnet
        with:
          version: ${{ github.event.inputs.version || steps.release-version.outputs.version }}
      - name: Create Nuget package(s)
        run: dotnet pack --configuration Release /p:VersionPrefix=${{ github.event.inputs.version || steps.release-version.outputs.version }}
        working-directory: src
      - name: Publish Nuget package(s)
        run: dotnet nuget push **/**/*.nupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.PUBLIC_NUGET_TOKEN }}
        working-directory: src

      # Update Documentation
      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "16.x"
      - run: yarn install
        working-directory: docs/public
      - run: yarn build
        working-directory: docs/public
      - run: |
          git config --global user.name $GITHUB_ACTOR
          git config --global user.email $GITHUB_ACTOR@users.noreply.github.com
          yarn deploy --skip-build
        working-directory: docs/public
        env:
          GIT_USER: $GITHUB_ACTOR
          GIT_PASS: ${{ secrets.GITHUB_TOKEN }}

      # GitHub
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Version ${{ github.event.inputs.version || steps.release-version.outputs.version }}
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || steps.release-version.outputs.version-name }}
          prerelease: ${{ github.event.inputs.pre-release || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
