name: Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Start containers
        run: |
          docker compose -f env/cosmos/docker-compose.yaml up -d --wait
          docker compose -f env/mongo/docker-compose.yaml up -d --wait

      # .NET Tests
      # the version input is only meaningful for the release workflow, the test
      # run just needs the projects compiled
      - name: Build .NET
        uses: ./.github/actions/dotnet
        with:
          version: test

      # Connection strings and database names come from the appsettings.json of
      # the test projects and point at the containers started above, so the test
      # run needs no credentials for a deployed database.
      - name: Test .NET Solution
        working-directory: src
        shell: bash
        run: dotnet test -c Release /p:CollectCoverage=true -m:1

      # the containers should be stopped regardless of the test result, and a
      # failing teardown of one stack must not leave the other one running
      - name: Stop Cosmos container
        if: always()
        run: docker compose -f env/cosmos/docker-compose.yaml down

      - name: Stop Mongo container
        if: always()
        run: docker compose -f env/mongo/docker-compose.yaml down

      - name: Code Coverage Summary Report
        uses: irongut/CodeCoverageSummary@v1.0.2
        with:
          filename: src/coverage.cobertura.xml
          badge: true
          format: 'markdown'
          output: 'both'

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        # fork and Dependabot PRs only get a read-only GITHUB_TOKEN on
        # pull_request, so the comment is skipped there instead of failing the job
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        with:
          recreate: true
          path: code-coverage-results.md
