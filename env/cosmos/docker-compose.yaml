services:
  cosmosdb:
    # Linux-based vNext emulator (GA since 2026-06-02): runs natively on x64 and
    # ARM64, boots in seconds and needs a fraction of the memory of the legacy
    # mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator image.
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    container_name: cosmosdb
    ports:
      - '8081:8081' # gateway endpoint
      - '8080:8080' # health probe
      - '1234:1234' # data explorer
    environment:
      # the .NET SDK does not support the emulator's default HTTP mode
      - PROTOCOL=https
      # run ./init-scripts before the emulator accepts requests, which replaces
      # the separate cosmos-db-setup container the legacy emulator needed
      - ENABLE_INIT_DATA=true
      - ENABLE_TELEMETRY=false
    volumes:
      - ./init-scripts:/init:ro
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8080/ready']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
