services:
  mongodb:
    image: mongo
    restart: always
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=test
      - MONGO_INITDB_DATABASE=infrastructuredbtests
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      # probe the routable address rather than 127.0.0.1: while the entrypoint
      # seeds the database it runs a temporary mongod bound to loopback only, and
      # a loopback probe reports healthy against that one, so `up --wait` would
      # return before the real server accepts connections
      test: ['CMD', 'mongosh', '--quiet', '--host', 'mongodb', '--eval', "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
